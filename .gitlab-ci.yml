stages:
  - prerender
  - deploy

# Прогоняет ноутбук ДЗ-07 «TripBuddy» (MAS + RAG) через nbconvert --execute
# и сохраняет HTML с встроенными outputs как артефакт для следующего stage.
# Это даёт преподавателю **готовый прогон** по статичной ссылке — без Jupyter,
# без ключей API (MODE=mock), без ожидания. Если ноутбук сломается — CI красный.
prerender_notebook:
  stage: prerender
  image: python:3.11-slim
  script:
    - pip install --quiet --no-cache-dir
        "langgraph>=0.2,<1.0"
        "langchain-core>=0.3,<1.0"
        jupyter nbconvert grandalf
    - mkdir -p public-prerender
    - jupyter nbconvert --to html --execute
        02-architecture/homework/07-ai-agents.ipynb
        --output 07-ai-agents.html
        --output-dir public-prerender
        --ExecutePreprocessor.timeout=180
  artifacts:
    paths:
      - public-prerender
    expire_in: 1 week
  only:
    - main

pages:
  stage: deploy
  image: alpine:3.19
  needs: ["prerender_notebook"]
  script:
    - mkdir -p public
    - cp 02-architecture/artifacts/diagrams/index.html public/index.html
    - cp 02-architecture/artifacts/diagrams/*.png public/
    - cp 02-architecture/artifacts/lesson-05-workspace.dsl public/workspace.dsl
    - cp 02-architecture/artifacts/lesson-05-openapi.yaml public/openapi.yaml
    - cp public-prerender/07-ai-agents.html public/07-ai-agents.html
  artifacts:
    paths:
      - public
  only:
    - main
