# Golden set по корпусу ЛПА — версионируемый эталон (урок 13, ADR-0018).
#
# Пункты адресуются парой «код документа + номер пункта», а не id чанка: id
# меняется при любой правке корпуса, а «ЛПА-01 § 1» — нет. Эталон должен
# переживать перечанкинг, иначе метрика меряет стабильность нумерации.
#
# Честность метрики (ADR-0017, раздел Compliance): изменение этого файла
# фиксируется ВМЕСТЕ с изменением цифр в отчёте. Улучшение метрики после правки
# golden set — не улучшение системы.
#
# Поля:
#   roles              — права субъекта (как придут из JWT)
#   relevant           — пункты, которые обязаны попасть в контекст
#   forbidden_docs     — коды документов, которых в выдаче быть не должно
#   expect_cancellation— ответ обязан нести пометку об отмене
#   route              — каким «цифровым сотрудникам» адресован вопрос (ADR-0015)
#   expect_empty       — правильный ответ: «не нашёл» (вопрос вне корпуса)

version: 1
cases:
  # ---------------------------------------------------------------- отпуск
  - id: otpusk-prodolzhitelnost
    question: Сколько дней основной ежегодный отпуск?
    roles: [all]
    relevant: [[ЛПА-04, "1"], [ЛПА-01, "1"]]
    expect_cancellation: true
    route: [hr]
    note: >-
      Ключевой кейс всей работы: без ребра ОТМЕНЯЕТ ответ «28 дней» формально
      находится вектором, но неверен.

  - id: otpusk-zayavlenie
    question: За сколько дней подаётся заявление на отпуск?
    roles: [all]
    relevant: [[ЛПА-01, "2"]]
    route: [hr]

  - id: otpusk-perenos
    question: Можно ли разделить отпуск на части и перенести его?
    roles: [all]
    relevant: [[ЛПА-01, "3"]]
    route: [hr]

  - id: otpusk-kompensaciya
    question: Когда выплачивается компенсация за неиспользованный отпуск?
    roles: [all]
    relevant: [[ЛПА-01, "4"]]
    route: [hr]

  # ---------------------------------------------------------- командировки
  - id: komandirovka-oformlenie
    question: Как оформляется служебная командировка?
    roles: [all]
    relevant: [[ЛПА-02, "1"]]
    route: [hr]

  - id: komandirovka-sutochnye
    question: Какой размер суточных при командировке по стране?
    roles: [all]
    relevant: [[ЛПА-02, "2"]]
    route: [hr]

  - id: komandirovka-avansovyy-otchet
    question: В какой срок сдаётся авансовый отчёт после командировки?
    roles: [all]
    relevant: [[ЛПА-02, "3"]]
    route: [hr]

  - id: komandirovka-vyhodnoy
    question: Как компенсируется работа в командировке в выходной день?
    roles: [all]
    relevant: [[ЛПА-02, "4"]]
    route: [hr]

  # ------------------------------------------------------------ доступ и ПДн
  - id: pdn-komandirovannogo-bez-prav
    question: Как обрабатываются персональные данные командированного работника?
    roles: [all]
    relevant: [[ЛПА-02, "3.1"]]
    forbidden_docs: [ЛПА-03]
    route: [hr, compliance]
    note: >-
      Обязательный сценарий ТЗ «User B»: пункт-отсылка виден, а сам закрытый
      регламент — нет, в том числе через структуру связей.

  - id: pdn-komandirovannogo-s-pravami
    question: Как обрабатываются персональные данные командированного работника?
    roles: [legal]
    relevant: [[ЛПА-02, "3.1"], [ЛПА-03, "1"]]
    route: [hr, compliance]
    note: >-
      Та же связь с правами: ЛПА-03 приходит по ребру ССЫЛАЕТСЯ_НА.

  - id: pdn-minimalnye-privilegii
    question: Что такое принцип минимальных привилегий при доступе к персональным данным?
    roles: [legal]
    relevant: [[ЛПА-03, "2"]]
    route: [compliance]

  - id: pdn-transgranichnaya-peredacha
    question: Разрешена ли трансграничная передача персональных данных?
    roles: [legal]
    relevant: [[ЛПА-03, "4"]]
    route: [compliance]

  - id: pdn-audit-bez-prav
    question: Где хранится журнал аудита обращений к персональным данным?
    roles: [all]
    forbidden_docs: [ЛПА-03]
    expect_empty: false
    route: [compliance]
    note: >-
      Ответа для этой роли в корпусе нет. Проверяется не «нашёл ли», а что
      закрытый документ не протёк ни в источники, ни в контекст модели.

  # --------------------------------------------------------- вне компетенции
  - id: vne-korpusa
    question: Каков регламент запуска спутника на геостационарную орбиту?
    roles: [all]
    expect_empty: true
    note: >-
      Честный отказ — тоже правильный ответ. Без этого кейса метрика поощряет
      систему, которая всегда что-нибудь отвечает.
