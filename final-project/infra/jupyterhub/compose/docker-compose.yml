name: jupyterhub

# В compose-репо artcloud/devops/jupyterhub после копирования также нужны:
#   - jupyterhub_config.py (рядом с этим файлом)
#   - Dockerfile.singleuser (для сборки сервиса `singleuser` ниже)
#   - .env (генерится cloud-init'ом из template_vars OpenTofu)

x-logging: &default-logging
  driver: loki
  options:
    loki-url: "http://10.100.1.43:3100/loki/api/v1/push"   # сверить адрес Loki
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'

services:
  jupyterhub:
    image: jupyterhub/jupyterhub:5
    container_name: jupyterhub
    hostname: jupyterhub
    restart: unless-stopped
    networks:
      - jupyterhub_net
    ports:
      # Открываем только 8000 во внутреннюю серую сеть; TLS делает внешний reverse-proxy.
      - "10.100.1.47:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - jupyterhub_data:/srv/jupyterhub
    environment:
      DOCKER_NETWORK_NAME: jupyterhub_net
      DOCKER_NOTEBOOK_IMAGE: tripbuddy-singleuser:latest
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-https://jupyterhub.example.lan/hub/oauth_callback}
      WHITELIST: ${WHITELIST}
      CONFIGPROXY_AUTH_TOKEN: ${CONFIGPROXY_AUTH_TOKEN}
    command: >
      jupyterhub --no-ssl
        --config /srv/jupyterhub/jupyterhub_config.py
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/hub/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # «фиктивный» сервис только для сборки singleuser-образа на хосте; не запускается hub'ом —
  # DockerSpawner стартует контейнеры из tripbuddy-singleuser:latest напрямую через docker.sock.
  singleuser:
    profiles: ["build-only"]
    image: tripbuddy-singleuser:latest
    build:
      context: .
      dockerfile: Dockerfile.singleuser
    command: ["echo", "build-only service; not started"]

volumes:
  jupyterhub_data:

networks:
  jupyterhub_net:
    name: jupyterhub_net   # имя должно совпадать с c.DockerSpawner.network_name
    driver: bridge
