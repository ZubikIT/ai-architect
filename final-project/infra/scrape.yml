# Скрейп-конфиг (Prometheus-совместимый, ADR-0017).
# Прод-контур: те же job'ы заведены в VictoriaMetrics рядом с Grafana.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # ВНИМАНИЕ: подстановка здесь — %{ENV_VAR}, а НЕ ${VAR:-default}. Синтаксис
  # compose VictoriaMetrics не разворачивает: оба job'а ниже молча пропускались
  # («invalid port after host»), и метрик vLLM и GPU просто не существовало.
  # Значения по умолчанию задаёт compose, подставляя их в окружение контейнера.

  # vLLM на GPU-ноде — серии vllm:* (токены, latency, очередь)
  - job_name: vllm-engine
    static_configs:
      - targets: ["%{VLLM_METRICS_TARGET}"]

  # GPU — nvidia_gpu_exporter (серии nvidia_smi_*), не DCGM
  - job_name: gpu
    static_configs:
      - targets: ["%{GPU_EXPORTER_TARGET}"]
