# Стек платформы цифровых корпоративных сотрудников — dev / demo.
# Прод-развёртывание описано в Deployment-диаграмме (../docs/diagrams/c4.md):
# vLLM живёт на GPU-ноде отдельно и подключается как внешний OpenAI-совместимый эндпоинт.
#
# Профили:
#   core  — знания и приложение (Neo4j, Qdrant, PostgreSQL, backend)
#   obs   — наблюдаемость (OTel Collector, Jaeger, VictoriaMetrics, Grafana)
# Запуск всего:  docker compose --profile core --profile obs up -d

name: cifrovye-sotrudniki

services:
  # ---------- Data Plane ----------
  neo4j:
    image: neo4j:5-community
    profiles: [core]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?задайте NEO4J_PASSWORD в .env}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_dbms_usage__report_enabled: "false"   # air-gapped: без телеметрии
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser — визуализация графа для демо
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./backups/neo4j:/backups          # neo4j-admin dump по расписанию (ADR-0012)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    profiles: [core]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]       # образ без curl/wget; проверка снаружи
      interval: 30s

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Control Plane ----------
  backend:
    build:
      context: ../backend
    profiles: [core]
    environment:
      # LLM — внешний vLLM (GPU-нода). Для офлайн-демо: SUFLER_USE_LLM=0
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed}
      SUFLER_LLM_MODEL: ${SUFLER_LLM_MODEL:-Qwen3.5-27B}
      SUFLER_USE_LLM: ${SUFLER_USE_LLM:-1}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      # доступ: роли берутся из проверенного JWT (ADR-0016), не из тела запроса.
      # Пусто → dev-режим; сервис сообщает об этом в /healthz.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-groups}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: platform-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ---------- Observability (ADR-0017) ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [obs]
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      # dev/demo: трейсы не сэмплируются, чтобы request_id из ответа всегда
      # находился в Jaeger. В контуре значение снижается (ADR-0017).
      OTEL_SAMPLING_PERCENT: ${OTEL_SAMPLING_PERCENT:-100}
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # метрики для скрейпа

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [obs]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # UI трейсов — кадр для видео-демо

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    profiles: [obs]
    command:
      - "--promscrape.config=/etc/vm/scrape.yml"
      - "--retentionPeriod=3"
    environment:
      # scrape.yml разворачивает их как %{...} — см. комментарий в файле
      VLLM_METRICS_TARGET: ${VLLM_METRICS_TARGET:-host.docker.internal:8000}
      GPU_EXPORTER_TARGET: ${GPU_EXPORTER_TARGET:-host.docker.internal:9835}
    volumes:
      - ./scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/victoria-metrics-data
    ports:
      - "${VM_PORT:-8428}:8428"

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?задайте GRAFANA_PASSWORD в .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"   # air-gapped
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      # Датасорс и дашборды — кодом, а не кликами: пересоздание стенда не должно
      # означать повторную ручную сборку панелей (урок 18).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - victoriametrics

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  pg-data:
  vm-data:
  grafana-data:
