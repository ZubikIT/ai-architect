# OTel Collector — единая точка приёма спанов и метрик (ADR-0017).
# Экспорт: трейсы → Jaeger, метрики → скрейп VictoriaMetrics.
# ВАЖНО: санитизация ПДн выполняется в приложении ДО экспорта; здесь — только
# страховочное удаление заведомо чувствительных атрибутов.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  attributes/scrub:
    actions:
      - key: user.email
        action: delete
      - key: http.request.header.authorization
        action: delete
  # ADR-0017 требует «полные трейсы для ошибок и медленных запросов, сэмплирование
  # для остальных» — это tail-based решение: судить о трейсе можно только когда он
  # закончился. Плоский probabilistic_sampler, стоявший здесь раньше, резал 80 %
  # трейсов на входе, и request_id из ответа в четырёх случаях из пяти не
  # находился в Jaeger — на демо это выглядит как «трейсинга нет».
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      # Отказ по правам и блок guardrail — материал для разбора инцидента
      # (ADR-0016: отказ такое же событие аудита, как выдача). Не сэмплируем.
      - name: security-relevant
        type: string_attribute
        string_attribute:
          key: outcome
          values: [no_access, blocked]
      # Остальное: в dev/demo — всё, в контуре процент снижается.
      - name: rest
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:OTEL_SAMPLING_PERCENT}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
