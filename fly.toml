# Fly.io конфиг для интерактивного Structurizr Lite (Суфлёр БФТ).
# Расположен в корне репо — Fly GitHub auto-deploy ищет fly.toml именно тут.

app = "ai-architect"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
