openapi: 3.1.0
info:
  title: Суфлёр БФТ — Dialog Engine API
  version: 1.0.0
  description: |
    Контракт между Backend (Orchestrator) и AI Service (Dialog Engine) голосового
    ассистента «Суфлёр БФТ» (БФТ-кейс из урока 2 — обзвон клиентов отеля по
    бронированиям). Точка интеграции — эндпоинт `/get_recommendation`: принимает
    реплику клиента (аудио или транскрипт) и контекст сделки, возвращает фразу-
    ответ для синтеза и следующее действие диалога (продолжить / перевести на
    оператора / завершить).

    Ошибки оформлены по **RFC 7807 Problem Details** (`application/problem+json`).

    **Контракт-стратегия:** Contract First. Этот YAML — источник правды; стабы
    клиента и сервера генерируются из него, фронтенд админки и Backend могут
    разрабатываться параллельно.
  contact:
    name: Зубик Александр
    email: alexzub2009@gmail.com
  license:
    name: Internal · OTUS coursework
servers:
  - url: https://ai.sufler.bft.internal/v1
    description: Production (Yandex Cloud · RU-Central)
  - url: https://ai.sufler.staging.bft.internal/v1
    description: Staging

tags:
  - name: Dialog
    description: Голосовой turn — основной поток инференса
  - name: Health
    description: Health/Readiness — для k8s-зондов

security:
  - bearerAuth: []

paths:
  /get_recommendation:
    post:
      tags: [Dialog]
      summary: Получить ответ бота на реплику клиента
      description: |
        Принимает один **turn** диалога: реплика клиента (аудио-URI или готовый
        транскрипт со стороны Voice Gateway) и контекст сделки/сессии.
        Возвращает текст для синтеза, классифицированный интент и команду
        Dialogue Manager (`CONTINUE` / `TRANSFER_TO_OPERATOR` / `HANGUP` /
        `SCHEDULE_CALLBACK` / `SEND_SMS`).

        Сценарий FR-3.x:
        - FR-3.1 Согласие → `HANGUP` + задача в Б24 на проверку оплаты.
        - FR-3.2 Отсрочка → `CONTINUE` (уточнение даты).
        - FR-3.3 Отказ → `CONTINUE` (подтверждение) → `HANGUP`.
        - FR-3.4 За рулём → `SCHEDULE_CALLBACK` (+1 час).
        - FR-3.5 Дорого → `CONTINUE` (предложение рассрочки) или `TRANSFER`.
        - FR-3.6 Агрессия → немедленный `TRANSFER_TO_OPERATOR`.
        - FR-3.7 Запрос человека → `TRANSFER_TO_OPERATOR`.
      operationId: getRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            examples:
              transcript_intent_dorogo:
                summary: Транскрипт, интент «дорого» (FR-3.5)
                value:
                  session_id: "8a4f3c2e-9d1b-4f0a-b7e6-2e5d8a1c0f31"
                  deal:
                    id: "DEAL-2026-04823"
                    hotel: "Снежная Сказка"
                    city: "Сочи"
                    cost_rub: 38500
                    payment_link: "https://pay.example.com/d/abc123"
                  client_utterance:
                    transcript: "Нашли дешевле в другом отеле"
                    confidence: 0.92
                    duration_ms: 1800
                    audio_uri: "s3://sufler-audio/2026/05/19/8a4f3c2e/utter-003.opus"
                  dialogue_state:
                    turn: 3
                    history:
                      - { role: "bot", text: "Здравствуйте! Это автоматический звонок..." }
                      - { role: "client", text: "Слушаю" }
                      - { role: "bot", text: "Напоминаю об оплате брони в отеле Снежная Сказка..." }
              audio_only_first_turn:
                summary: Аудио-URI, первый turn после приветствия (без транскрипта)
                value:
                  session_id: "8a4f3c2e-9d1b-4f0a-b7e6-2e5d8a1c0f31"
                  deal:
                    id: "DEAL-2026-04823"
                    hotel: "Снежная Сказка"
                    city: "Сочи"
                    cost_rub: 38500
                    payment_link: "https://pay.example.com/d/abc123"
                  client_utterance:
                    audio_uri: "s3://sufler-audio/2026/05/19/8a4f3c2e/utter-001.opus"
                    duration_ms: 1200
                  dialogue_state:
                    turn: 1
                    history: []
      responses:
        '200':
          description: Ответ бота сформирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              examples:
                dorogo_offer_installment:
                  summary: Интент «дорого» → предложение рассрочки
                  value:
                    intent:
                      code: "objection_too_expensive"
                      label: "Дорого"
                      fr_id: "FR-3.5"
                      confidence: 0.88
                    response_text: "Понимаю Вас. Мы можем оформить оплату в рассрочку на 3 месяца без процентов. Хотите, я переведу на специалиста, который оформит?"
                    ssml: "<speak>Понимаю Вас<break time=\"200ms\"/>Мы можем оформить оплату в рассрочку на <emphasis>три месяца</emphasis> без процентов.</speak>"
                    next_action:
                      type: "CONTINUE"
                      timeout_ms: 8000
                    rag_sources:
                      - phrase_id: "obj_dorogo_rassrochka_v2"
                        similarity: 0.81
                    cost:
                      llm_tokens_in: 412
                      llm_tokens_out: 38
                      stt_ms: 320
                      tts_ms: 410
                      total_latency_ms: 980
                transfer_aggression:
                  summary: Интент «агрессия» → немедленный перевод (FR-3.6)
                  value:
                    intent:
                      code: "aggression"
                      label: "Агрессия / мат"
                      fr_id: "FR-3.6"
                      confidence: 0.97
                    response_text: "Извините за беспокойство. Соединяю Вас со специалистом."
                    next_action:
                      type: "TRANSFER_TO_OPERATOR"
                      queue: "kc_high_priority"
                      timeout_ms: 0
                    cost:
                      total_latency_ms: 410
                unrecognized_reask:
                  summary: Реплика не распознана → переспрос (FR-2.3), штатный 200 OK
                  description: |
                    NLU не уверен (confidence ниже порога) — это НЕ ошибка, а штатный
                    бизнес-исход (клиент промолчал / чихнул / сказал нерелевантное).
                    Сервис сам формирует фразу-переспрос и команду `CONTINUE`.
                    Решение «переспросить vs эскалировать» принимает Dialogue Manager
                    по `dialogue_state.retry_count` — и выражает его через `next_action`.
                  value:
                    intent:
                      code: "unrecognized"
                      label: "Не распознано"
                      fr_id: "FR-2.3"
                      confidence: 0.31
                    response_text: "Извините, не расслышала. Повторите, пожалуйста."
                    next_action:
                      type: "CONTINUE"
                      timeout_ms: 8000
                    cost:
                      stt_ms: 290
                      tts_ms: 360
                      total_latency_ms: 720
                unrecognized_escalate:
                  summary: Реплика снова не распознана, retry_count исчерпан → перевод
                  description: |
                    Тот же интент `unrecognized`, но `retry_count` превысил лимит (FR-2.3):
                    Dialogue Manager эскалирует на оператора — снова через `next_action`,
                    без HTTP-ошибки.
                  value:
                    intent:
                      code: "unrecognized"
                      label: "Не распознано"
                      fr_id: "FR-2.3"
                      confidence: 0.28
                    response_text: "Соединяю Вас со специалистом, он поможет."
                    next_action:
                      type: "TRANSFER_TO_OPERATOR"
                      queue: "kc_default"
                      timeout_ms: 0
                    cost:
                      stt_ms: 300
                      total_latency_ms: 540
        '400':
          $ref: '#/components/responses/BadRequest'
          # Например: невалидный schema, нет deal.id, audio_uri недоступен
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
          # CPS-лимит на инстанс / квота LLM-провайдера
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
          # STT / TTS / LLM упал — Backend должен сделать fallback (rule-based фраза)
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        # ВАЖНО: нераспознанная реплика (NLU не уверен) — это НЕ HTTP-ошибка, а штатный
        # бизнес-исход. Возвращается 200 OK с intent.code=unrecognized и готовой фразой-
        # переспросом в response_text (см. пример unrecognized_reask). HTTP-коды 4xx/5xx
        # зарезервированы под битый запрос (400/401) и инфраструктурные сбои (503/504).

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Готов принимать трафик (STT/TTS/LLM/Qdrant доступны)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  dependencies:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, down]
        '503':
          description: Не готов (одна из зависимостей недоступна)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT, выписанный Backend'ом. Срок жизни — длительность звонка + 5 мин.

  schemas:
    RecommendationRequest:
      type: object
      required: [session_id, deal, client_utterance, dialogue_state]
      properties:
        session_id:
          type: string
          format: uuid
          description: ID сессии диалога (1 сессия = 1 звонок)
          example: "8a4f3c2e-9d1b-4f0a-b7e6-2e5d8a1c0f31"
        deal:
          $ref: '#/components/schemas/Deal'
        client_utterance:
          $ref: '#/components/schemas/ClientUtterance'
        dialogue_state:
          $ref: '#/components/schemas/DialogueState'
        constraints:
          $ref: '#/components/schemas/TurnConstraints'

    Deal:
      type: object
      required: [id, hotel, city, cost_rub]
      properties:
        id:         { type: string, example: "DEAL-2026-04823" }
        hotel:      { type: string, example: "Снежная Сказка" }
        city:       { type: string, example: "Сочи" }
        cost_rub:   { type: integer, minimum: 0, example: 38500 }
        payment_link:
          type: string
          format: uri
          nullable: true
          description: |
            Ссылка на оплату. Если `null`, бот не имеет права обещать ссылку
            клиенту (BR-04) — Dialogue Manager перейдёт на ветку перевода
            на оператора.

    ClientUtterance:
      type: object
      description: Реплика клиента — транскрипт И/ИЛИ ссылка на аудио
      properties:
        transcript:  { type: string, description: "Финальный транскрипт от STT (если есть)" }
        confidence:  { type: number, format: float, minimum: 0, maximum: 1 }
        duration_ms: { type: integer, minimum: 0 }
        audio_uri:
          type: string
          format: uri
          description: |
            URI аудиочанка (S3). Если `transcript` пуст, AI Service сам сходит
            в STT-провайдера. Если `transcript` уже есть — `audio_uri`
            используется только для логов и переанализа.
      anyOf:
        - required: [transcript]
        - required: [audio_uri]

    DialogueState:
      type: object
      required: [turn, history]
      properties:
        turn:
          type: integer
          minimum: 1
          description: Номер хода в диалоге (1 = первая реплика клиента после приветствия)
        history:
          type: array
          items:
            type: object
            required: [role, text]
            properties:
              role: { type: string, enum: [bot, client] }
              text: { type: string }
              intent_code: { type: string, nullable: true }
        retry_count:
          type: integer
          minimum: 0
          default: 0
          description: Сколько раз бот переспрашивал из-за неразобранной реплики (FR-2.3)

    TurnConstraints:
      type: object
      description: Бизнес-правила и лимиты для текущего turn
      properties:
        max_response_chars:
          type: integer
          minimum: 50
          maximum: 1000
          default: 300
          description: Максимум символов в TTS, чтобы держать паузу клиента короткой
        voice_persona:
          type: string
          enum: [elena, dasha]
          default: elena
          description: Голос синтеза (FR-2.2)
        local_time_iso:
          type: string
          format: date-time
          description: |
            Локальное время отеля — для выбора приветствия (доброе утро/вечер) и
            таймстемпов в логах. НЕ является точкой контроля BR-01: правило «звонки
            только 10:00–19:00» обеспечивает Call Scheduler на этапе инициации вызова
            (единственное место с безопасным действием — не ставить звонок в очередь).
            Dialog Engine не обрывает уже идущий разговор по времени. Если нужна
            «мягкая посадка» у границы окна — это отдельный сигнал (`wind_down`),
            который вычисляет Backend/Scheduler, а не выводится здесь из времени.

    RecommendationResponse:
      type: object
      required: [intent, response_text, next_action, cost]
      properties:
        intent:        { $ref: '#/components/schemas/Intent' }
        response_text: { type: string, description: "Финальная фраза бота (plain text)" }
        ssml:          { type: string, description: "SSML-разметка для TTS (опционально)" }
        next_action:   { $ref: '#/components/schemas/NextAction' }
        rag_sources:
          type: array
          description: Источники, из которых RAG Manager собрал фразу (для аудита)
          items:
            type: object
            properties:
              phrase_id:  { type: string }
              similarity: { type: number, format: float }
        cost:          { $ref: '#/components/schemas/TurnCost' }

    Intent:
      type: object
      required: [code, fr_id, confidence]
      properties:
        code:
          type: string
          enum:
            - agreement
            - postponement
            - rejection
            - driving
            - objection_too_expensive
            - aggression
            - request_human
            - unrecognized
          description: |
            Кодовое имя интента. Маппинг на ТЗ:
            - `agreement` → FR-3.1
            - `postponement` → FR-3.2
            - `rejection` → FR-3.3
            - `driving` → FR-3.4
            - `objection_too_expensive` → FR-3.5
            - `aggression` → FR-3.6
            - `request_human` → FR-3.7
            - `unrecognized` → переспрашиваем (FR-2.3) или передаём `TRANSFER`
        label:      { type: string, description: "Человекочитаемое имя (для UI/логов)" }
        fr_id:      { type: string, example: "FR-3.5" }
        confidence: { type: number, format: float, minimum: 0, maximum: 1 }

    NextAction:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - CONTINUE
            - TRANSFER_TO_OPERATOR
            - HANGUP
            - SCHEDULE_CALLBACK
            - SEND_SMS
        timeout_ms:
          type: integer
          minimum: 0
          description: |
            Сколько ждать следующую реплику клиента (для `CONTINUE`). Для
            других action — `0`.
        queue:
          type: string
          description: Очередь КЦ (для `TRANSFER_TO_OPERATOR`)
        callback_at:
          type: string
          format: date-time
          description: Время повторного звонка (для `SCHEDULE_CALLBACK`)
        sms_template_id:
          type: string
          description: ID SMS-шаблона (для `SEND_SMS`)

    TurnCost:
      type: object
      description: Стоимость и латенси текущего turn (для FinOps и SLA)
      properties:
        llm_tokens_in:    { type: integer, minimum: 0 }
        llm_tokens_out:   { type: integer, minimum: 0 }
        stt_ms:           { type: integer, minimum: 0 }
        tts_ms:           { type: integer, minimum: 0 }
        total_latency_ms: { type: integer, minimum: 0 }

    Problem:
      type: object
      description: RFC 7807 Problem Details
      required: [type, title]
      properties:
        type:     { type: string, format: uri, description: "URI-идентификатор типа ошибки" }
        title:    { type: string, description: "Краткое человекочитаемое описание" }
        status:   { type: integer, minimum: 100, maximum: 599 }
        detail:   { type: string, description: "Подробности для разработчика" }
        instance: { type: string, format: uri-reference, description: "URI конкретного инцидента" }
        trace_id: { type: string, description: "ID для поиска в трейсинге" }
      additionalProperties: true

  responses:
    BadRequest:
      description: Невалидный запрос (схема, отсутствие обязательных полей)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.sufler.bft/probs/bad-request"
            title: "Invalid request body"
            status: 400
            detail: "Field 'deal.id' is required"
            instance: "/v1/get_recommendation"
            trace_id: "01HXY3Z6P0F4Q7"

    Unauthorized:
      description: JWT отсутствует / истёк / невалиден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    RateLimited:
      description: CPS-лимит или квота LLM/STT провайдера превышена
      headers:
        Retry-After:
          schema: { type: integer, description: "Секунд до следующей попытки" }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UpstreamUnavailable:
      description: STT / TTS / LLM / Vector DB недоступен. Circuit Breaker открыт.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.sufler.bft/probs/upstream-unavailable"
            title: "LLM provider unavailable"
            status: 503
            detail: "Circuit breaker open for llm.ru-llm-1; tripped at 2026-05-19T12:43:11Z"
            upstream: "llm.ru-llm-1"
            recommended_action: "use_rule_based_fallback"

    UpstreamTimeout:
      description: Превышен SLA на ответ от STT / LLM / TTS
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
